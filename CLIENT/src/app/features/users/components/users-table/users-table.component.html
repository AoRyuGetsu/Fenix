<ng-template #playerDetailTpl let-item>
  <app-player-detail-cards [model]="item._playerModel" />
</ng-template>

<ng-template #personDetailTpl let-item>
  <app-person-detail-cards [model]="item._personModel" />
</ng-template>

<app-gtable
  [columns]="columns()"
  [data]="processedItems()"
  [pagination]="{ page: page(), perPage: perPage(), total: total() }"
  [detail]="detailConfig()"
  [actions]="actions()"
  (pageChange)="pageChange.emit($event)"
  (actionClick)="onAction($event)" />
