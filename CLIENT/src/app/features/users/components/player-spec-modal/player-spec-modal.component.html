<div class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">{{ isUpdate() ? ('play_spec_hdr_edit' | message) : ('play_spec_hdr_new' | message) }}</h5>
        <button type="button" class="btn-close" (click)="onClose()"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <h6 class="text-primary border-bottom pb-2 mb-0">{{ 'play_spec_lbl_physical_data' | message }}</h6>
          <div class="col-md-4">
            <label class="form-label">{{ 'play_spec_lbl_birth_date' | message }} <span class="text-danger">*</span></label>
            <input #inputBirth type="date" class="form-control" [value]="birthDate()" (input)="birthDate.set(inputBirth.value)" />
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ 'play_spec_lbl_height_cm' | message }} <span class="text-danger">*</span></label>
            <input #inputHeight type="number" step="0.01" class="form-control" [value]="heightCm()" (input)="heightCm.set(+inputHeight.value)" />
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ 'play_spec_lbl_weight_kg' | message }} <span class="text-danger">*</span></label>
            <input #inputWeight type="number" step="0.01" class="form-control" [value]="weightKg()" (input)="weightKg.set(+inputWeight.value)" />
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ 'play_spec_lbl_gender' | message }} <span class="text-danger">*</span></label>
            <select #selGender class="form-select" [value]="gender()" (change)="gender.set(selGender.value)">
              <option value="">{{ 'play_spec_plh_select' | message }}</option>
              <option value="male">{{ 'play_spec_lbl_male' | message }}</option>
              <option value="female">{{ 'play_spec_lbl_female' | message }}</option>
              <option value="other">{{ 'play_spec_lbl_other' | message }}</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ 'play_spec_lbl_nationality' | message }}</label>
            <input #inputNationality type="text" class="form-control" [value]="nationality()" (input)="nationality.set(inputNationality.value)" />
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ 'play_spec_lbl_blood_type' | message }}</label>
            <select #selBlood class="form-select" [value]="bloodType()" (change)="bloodType.set(selBlood.value)">
              <option value="">{{ 'play_spec_plh_select' | message }}</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>

          <h6 class="text-primary border-bottom pb-2 mb-0 mt-2">{{ 'play_spec_lbl_sports_data' | message }}</h6>
          <div class="col-md-6">
            <label class="form-label">{{ 'play_spec_lbl_position' | message }}</label>
            <input #inputPosition type="text" class="form-control" [value]="position()" (input)="position.set(inputPosition.value)" [placeholder]="'play_spec_plh_position' | message" />
          </div>
          <div class="col-md-2">
            <label class="form-label">{{ 'play_spec_lbl_jersey_number_1' | message }}</label>
            <input #inputJersey1 type="number" class="form-control" [value]="jerseyNumber1()" (input)="jerseyNumber1.set(+inputJersey1.value || null)" />
          </div>
          <div class="col-md-2">
            <label class="form-label">{{ 'play_spec_lbl_jersey_number_2' | message }}</label>
            <input #inputJersey2 type="number" class="form-control" [value]="jerseyNumber2()" (input)="jerseyNumber2.set(+inputJersey2.value || null)" />
          </div>
          <div class="col-md-2">
            <label class="form-label">{{ 'play_spec_lbl_jersey_number_3' | message }}</label>
            <input #inputJersey3 type="number" class="form-control" [value]="jerseyNumber3()" (input)="jerseyNumber3.set(+inputJersey3.value || null)" />
          </div>
          <div class="col-md-3">
            <label class="form-label">{{ 'play_spec_lbl_dominant_foot' | message }}</label>
            <select #selFoot class="form-select" [value]="dominantFoot()" (change)="dominantFoot.set(selFoot.value)">
              <option value="">{{ 'play_spec_plh_select' | message }}</option>
              <option value="left">{{ 'play_spec_lbl_foot_left' | message }}</option>
              <option value="right">{{ 'play_spec_lbl_foot_right' | message }}</option>
              <option value="ambidextrous">{{ 'play_spec_lbl_foot_ambidextrous' | message }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">{{ 'play_spec_lbl_category' | message }}</label>
            <select #selCategory class="form-select" [value]="category()" (change)="category.set(selCategory.value)">
              <option value="">{{ 'play_spec_plh_select' | message }}</option>
              <option value="SUB10">Sub-10</option>
              <option value="SUB12">Sub-12</option>
              <option value="SUB14">Sub-14</option>
              <option value="SUB16">Sub-16</option>
              <option value="LIBRE">Libre</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">{{ 'play_spec_lbl_shirt_size' | message }}</label>
            <select #selSize class="form-select" [value]="shirtSize()" (change)="shirtSize.set(selSize.value)">
              <option value="">{{ 'play_spec_plh_select' | message }}</option>
              <option value="XS">XS</option>
              <option value="S">S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">{{ 'play_spec_lbl_player_status' | message }}</label>
            <select #selStatus class="form-select" [value]="status()" (change)="status.set(selStatus.value)">
              <option value="active">{{ 'play_spec_lbl_status_active' | message }}</option>
              <option value="injured">{{ 'play_spec_lbl_status_injured' | message }}</option>
              <option value="suspended">{{ 'play_spec_lbl_status_suspended' | message }}</option>
              <option value="inactive">{{ 'play_spec_lbl_status_inactive' | message }}</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ 'play_spec_lbl_basketball_experience' | message }}</label>
            <select #selExp class="form-select" [value]="basketballExperience()" (change)="basketballExperience.set(selExp.value)">
              <option value="">{{ 'play_spec_plh_select' | message }}</option>
              <option value="1">{{ 'play_spec_lbl_yes' | message }}</option>
              <option value="0">{{ 'play_spec_lbl_no' | message }}</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ 'play_spec_lbl_previous_club' | message }}</label>
            <input #inputPrevClub type="text" class="form-control" [value]="previousClub()" (input)="previousClub.set(inputPrevClub.value)" />
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ 'play_spec_lbl_entry_date' | message }} <span class="text-danger">*</span></label>
            <input #inputEntry type="date" class="form-control" [value]="entryDate()" (input)="entryDate.set(inputEntry.value)" />
          </div>

          <h6 class="text-primary border-bottom pb-2 mb-0 mt-2">{{ 'play_spec_lbl_emergency_contact' | message }}</h6>
          <div class="col-md-4">
            <label class="form-label">{{ 'play_spec_lbl_contact_name' | message }} <span class="text-danger">*</span></label>
            <input #inputEmerName type="text" class="form-control" [value]="emergencyContactName()" (input)="emergencyContactName.set(inputEmerName.value)" />
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ 'play_spec_lbl_contact_phone' | message }} <span class="text-danger">*</span></label>
            <input #inputEmerPhone type="text" class="form-control" [value]="emergencyContactPhone()" (input)="emergencyContactPhone.set(inputEmerPhone.value)" />
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ 'play_spec_lbl_relationship' | message }} <span class="text-danger">*</span></label>
            <input #inputEmerRel type="text" class="form-control" [value]="emergencyContactRelationship()" (input)="emergencyContactRelationship.set(inputEmerRel.value)" [placeholder]="'play_spec_plh_relationship' | message" />
          </div>

          <h6 class="text-primary border-bottom pb-2 mb-0 mt-2">{{ 'play_spec_lbl_medical_info' | message }}</h6>
          <div class="col-6">
            <label class="form-label">{{ 'play_spec_lbl_medical_conditions' | message }}</label>
            <textarea #inputMedCond class="form-control" rows="2" [value]="medicalConditions()" (input)="medicalConditions.set(inputMedCond.value)" [placeholder]="'play_spec_plh_medical' | message"></textarea>
          </div>
          <div class="col-6">
            <label class="form-label">{{ 'play_spec_lbl_allergies' | message }}</label>
            <textarea #inputAllergies class="form-control" rows="2" [value]="allergies()" (input)="allergies.set(inputAllergies.value)" [placeholder]="'play_spec_plh_allergies' | message"></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ 'play_spec_lbl_insurance' | message }}</label>
            <input #inputInsurance type="text" class="form-control" [value]="insurance()" (input)="insurance.set(inputInsurance.value)" [placeholder]="'play_spec_plh_insurance' | message" />
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ 'play_spec_lbl_medications' | message }}</label>
            <textarea #inputMedications class="form-control" rows="2" [value]="medications()" (input)="medications.set(inputMedications.value)" [placeholder]="'play_spec_plh_medications' | message"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" (click)="onClose()" [disabled]="loading()">{{ 'cr_btn_cancel' | message }}</button>
        <button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="loading() || !birthDate() || !heightCm() || !weightKg() || !gender() || !entryDate() || !emergencyContactName() || !emergencyContactPhone() || !emergencyContactRelationship()">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm me-1"></span>
          }
          {{ isUpdate() ? ('cr_btn_update' | message) : ('cr_btn_save' | message) }}
        </button>
      </div>
    </div>
  </div>
</div>
