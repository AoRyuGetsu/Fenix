<div class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">{{ vm().t('usr_hdr_create_admin') }}</h5>
        <button type="button" class="btn-close" (click)="onClose()"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">{{ vm().t('usr_lbl_email') }} <span class="text-danger">*</span></label>
            <input #emailInput type="email" class="form-control" [value]="vm().email" (input)="email.set(emailInput.value)" />
          </div>
          <div class="col-12">
            <label class="form-label">{{ vm().t('usr_lbl_password') }} <span class="text-danger">*</span></label>
            <input #passwordInput type="password" class="form-control" [value]="vm().password" (input)="password.set(passwordInput.value)" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" (click)="onClose()" [disabled]="vm().loading">{{ vm().t('cr_btn_cancel') }}</button>
        <button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="vm().loading || !vm().email || !vm().password">
          @if (vm().loading) {
            <span class="spinner-border spinner-border-sm me-1"></span>
          }
          {{ vm().t('cr_btn_save') }}
        </button>
      </div>
    </div>
  </div>
</div>
