<div class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">{{ vm().t('usr_hdr_update_admin') }}</h5>
        <button type="button" class="btn-close" (click)="onClose()"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">{{ vm().t('usr_lbl_email') }} <span class="text-danger">*</span></label>
            <input #emailInput type="email" class="form-control" [value]="vm().email" (input)="email.set(emailInput.value)" />
          </div>
          <div class="col-12">
            <div class="form-check">
              <input #activeChk type="checkbox" class="form-check-input" id="adminActive" [checked]="vm().active" (change)="active.set(activeChk.checked)" />
              <label class="form-check-label" for="adminActive">{{ vm().t('usr_lbl_account_active') }}</label>
            </div>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input #changePwdChk type="checkbox" class="form-check-input" id="adminChangePassword" [checked]="vm().changePassword" (change)="changePassword.set(changePwdChk.checked)" />
              <label class="form-check-label" for="adminChangePassword">{{ vm().t('usr_lbl_change_password') }}</label>
            </div>
          </div>
          @if (vm().changePassword) {
            <div class="col-12">
              <label class="form-label">{{ vm().t('usr_lbl_new_password') }}</label>
              <input #passwordInput type="password" class="form-control" [value]="vm().password" (input)="password.set(passwordInput.value)" />
            </div>
          }
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" (click)="onClose()" [disabled]="vm().loading">{{ vm().t('cr_btn_cancel') }}</button>
        <button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="vm().loading">
          @if (vm().loading) {
            <span class="spinner-border spinner-border-sm me-1"></span>
          }
          {{ vm().t('cr_btn_update') }}
        </button>
      </div>
    </div>
  </div>
</div>
