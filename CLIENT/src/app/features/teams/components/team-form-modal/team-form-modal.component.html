<div class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">
          {{ (isEdit() ? 'team_btn_edit' : 'team_btn_new') | message }}
        </h5>
        <button type="button" class="btn-close" (click)="onClose()"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">{{ 'team_lbl_name' | message }} <span class="text-danger">*</span></label>
            <input type="text" class="form-control" [value]="name()" (input)="onNameChange($event)" />
          </div>

          <div class="col-md-6">
            <label class="form-label">{{ 'team_lbl_code' | message }} <span class="text-danger">*</span></label>
            <input type="text" class="form-control" [value]="code()" (input)="onCodeChange($event)" />
          </div>

          <div class="col-12">
            <label class="form-label">{{ 'team_lbl_description' | message }}</label>
            <textarea class="form-control" rows="3" [value]="description()" (input)="onDescriptionChange($event)"></textarea>
          </div>

          <div class="col-md-6">
            <label class="form-label">{{ 'team_lbl_trainer' | message }} <span class="text-danger">*</span></label>
            @if (loadingTrainers()) {
              <div class="spinner-border spinner-border-sm text-primary"></div>
            } @else {
              <select class="form-select" [value]="trainerUserId() === null ? '' : trainerUserId()" (change)="onTrainerChange($event)">
                <option value="" disabled>{{ 'team_plh_select_trainer' | message }}</option>
                @for (t of trainers(); track t.id) {
                  <option [value]="t.id">{{ t.display_name }}</option>
                }
              </select>
            }
          </div>

          <div class="col-md-6">
            <label class="form-label">{{ 'team_lbl_players' | message }}</label>
            @if (loadingPlayers()) {
              <div class="spinner-border spinner-border-sm text-primary"></div>
            } @else {
              <div class="border rounded p-2" style="max-height: 200px; overflow-y: auto;">
                @for (p of players(); track p.id) {
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      [id]="'player_' + p.id"
                      [checked]="playerIds().includes(p.id)"
                      (change)="onPlayerToggle(p.id)"
                    />
                    <label class="form-check-label" [for]="'player_' + p.id">{{ p.display_name }}</label>
                  </div>
                }
                @if (players().length === 0) {
                  <span class="text-muted small">{{ 'team_lbl_no_players_available' | message }}</span>
                }
              </div>
            }
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" (click)="onClose()" [disabled]="saving()">
          {{ 'cr_btn_cancel' | message }}
        </button>
        <button type="button" class="btn btn-primary" (click)="onSubmit()"
          [disabled]="saving() || !name() || !code() || trainerUserId() === null">
          @if (saving()) {
            <span class="spinner-border spinner-border-sm me-1"></span>
          }
          {{ (isEdit() ? 'cr_btn_update' : 'cr_btn_save') | message }}
        </button>
      </div>
    </div>
  </div>
</div>
