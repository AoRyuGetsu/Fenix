<div class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">
          {{ vm().t(vm().isEdit ? 'team_btn_edit' : 'team_btn_new') }}
        </h5>
        <button type="button" class="btn-close" (click)="onClose()"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">{{ vm().t('team_lbl_name') }} <span class="text-danger">*</span></label>
            <input type="text" class="form-control" [value]="vm().name" (input)="onNameChange($event)" />
          </div>

          <div class="col-md-6">
            <label class="form-label">{{ vm().t('team_lbl_code') }} <span class="text-danger">*</span></label>
            <input type="text" class="form-control" [value]="vm().code" (input)="onCodeChange($event)" />
          </div>

          <div class="col-12">
            <label class="form-label">{{ vm().t('team_lbl_description') }}</label>
            <textarea class="form-control" rows="3" [value]="vm().description" (input)="onDescriptionChange($event)"></textarea>
          </div>

          <div class="col-md-6">
            <label class="form-label">{{ vm().t('team_lbl_trainer') }} <span class="text-danger">*</span></label>
            @if (vm().loadingTrainers) {
              <div class="spinner-border spinner-border-sm text-primary"></div>
            } @else {
              <select class="form-select" [value]="vm().trainerUserId === null ? '' : vm().trainerUserId" (change)="onTrainerChange($event)">
                <option value="" disabled>{{ vm().t('team_plh_select_trainer') }}</option>
                @for (t of vm().trainers; track t.id) {
                  <option [value]="t.id">{{ t.display_name }}</option>
                }
              </select>
            }
          </div>

          <div class="col-md-6">
            <label class="form-label">{{ vm().t('team_lbl_players') }}</label>
            @if (vm().loadingPlayers) {
              <div class="spinner-border spinner-border-sm text-primary"></div>
            } @else {
              <div class="border rounded p-2" style="max-height: 200px; overflow-y: auto;">
                @for (p of vm().players; track p.id) {
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      [id]="'player_' + p.id"
                      [checked]="vm().playerIds.includes(p.id)"
                      (change)="onPlayerToggle(p.id)"
                    />
                    <label class="form-check-label" [for]="'player_' + p.id">{{ p.display_name }}</label>
                  </div>
                }
                @if (vm().players.length === 0) {
                  <span class="text-muted small">{{ vm().t('team_lbl_no_players_available') }}</span>
                }
              </div>
            }
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" (click)="onClose()" [disabled]="vm().saving">
          {{ vm().t('cr_btn_cancel') }}
        </button>
        <button type="button" class="btn btn-primary" (click)="onSubmit()"
          [disabled]="vm().saving || !vm().name || !vm().code || vm().trainerUserId === null">
          @if (vm().saving) {
            <span class="spinner-border spinner-border-sm me-1"></span>
          }
          {{ vm().t(vm().isEdit ? 'cr_btn_update' : 'cr_btn_save') }}
        </button>
      </div>
    </div>
  </div>
</div>
