@let vm = facade.vm;

<div class="container-fluid py-3">
  <div class="row align-items-center mb-3">
    <div class="col">
      <h4 class="mb-0">{{ vm().t('team_hdr_title') }}</h4>
    </div>
    <div class="col-auto">
      <button class="btn btn-primary" (click)="onNew()">
        <i class="bi bi-plus-lg"></i> {{ vm().t('team_btn_new') }}
      </button>
    </div>
  </div>

  @if (vm().success) {
    <div class="alert alert-success alert-dismissible fade show" role="alert">
      {{ vm().success }}
      <button type="button" class="btn-close" (click)="facade.clearMessages()"></button>
    </div>
  }

  @if (vm().error) {
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      {{ vm().error }}
      <button type="button" class="btn-close" (click)="facade.clearMessages()"></button>
    </div>
  }

  <div class="row mb-3">
    <div class="col-md-4">
      <input
        #filterInput
        type="text"
        class="form-control"
        [placeholder]="vm().t('team_plh_search')"
        [value]="vm().searchTerm"
        (input)="onFilter(filterInput.value)"
      />
    </div>
  </div>

  <app-team-table
    [items]="vm().items"
    [loading]="vm().loading"
    [pagination]="pagination()"
    (pageChange)="onPageChange($event)"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  />
</div>

@if (vm().showFormModal) {
  <app-team-form-modal
    [item]="vm().editingItem"
    [saving]="vm().saving"
    [trainers]="vm().trainers"
    [players]="vm().players"
    [loadingTrainers]="vm().loadingTrainers"
    [loadingPlayers]="vm().loadingPlayers"
    (save)="facade.saveTeam($event)"
    (close)="facade.closeForm()"
  />
}
