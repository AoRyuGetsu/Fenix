<div class="card shadow h-100">
  <div class="card-header py-3 d-flex justify-content-between align-items-center">
    <ng-content select="[cardTitle]"></ng-content>
    @if (vm().regression; as reg) {
      <span class="badge {{ vm().trendBadgeClass }}">{{ reg.slope }}</span>
    }
  </div>
  <div class="card-body">
    <canvas baseChart
      [data]="vm().chartData"
      [options]="vm().chartOptions"
      [plugins]="vm().descriptorPlugin"
      type="scatter"
      style="min-height: 220px;">
    </canvas>
  </div>
</div>
