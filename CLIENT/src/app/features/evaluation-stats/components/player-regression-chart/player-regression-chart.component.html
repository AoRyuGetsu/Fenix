<div class="card shadow h-100">
  <div class="card-header py-3 d-flex justify-content-between align-items-center">
    <h6 class="m-0 fw-bold text-gray-800">{{ title() }}</h6>
    @if (regression(); as reg) {
      <span class="badge {{ trendBadgeClass() }}">{{ trendLabel() | message }}</span>
    }
  </div>
  <div class="card-body">
    <canvas baseChart
      [data]="chartData()"
      [options]="chartOptions"
      type="line"
      style="max-height: 200px;">
    </canvas>
    @if (showMeta() && regression(); as reg) {
      <div class="d-flex justify-content-center gap-4 mt-2 small text-muted">
        <span>{{ 'es_lbl_slope' | message }}: <strong>{{ reg.slope }}</strong></span>
        <span>R²: <strong>{{ reg.r_squared }}</strong></span>
      </div>
    }
  </div>
</div>
