<div class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        @if (vm().editing) {
          <h5 class="modal-title fw-bold">{{ vm().t('per_hdr_edit') }}</h5>
        } @else {
          <h5 class="modal-title fw-bold">{{ vm().t('per_hdr_new') }}</h5>
        }
        <button type="button" class="btn-close" (click)="onClose()"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">{{ vm().t('per_lbl_field_name') }} <span class="text-danger">*</span></label>
            <input #inputName type="text" class="form-control" [value]="vm().name" (input)="name.set(inputName.value)" [placeholder]="vm().t('per_plh_period_example')" />
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ vm().t('per_lbl_start_date') }} <span class="text-danger">*</span></label>
            <input #inputStart type="date" class="form-control" [value]="vm().startDate" (input)="startDate.set(inputStart.value)" />
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ vm().t('per_lbl_end_date') }} <span class="text-danger">*</span></label>
            <input #inputEnd type="date" class="form-control" [value]="vm().endDate" (input)="endDate.set(inputEnd.value)" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" (click)="onClose()" [disabled]="vm().saving">{{ vm().t('cr_btn_cancel') }}</button>
        <button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="vm().saving || !vm().name || !vm().startDate || !vm().endDate">
          @if (vm().saving) {
            <span class="spinner-border spinner-border-sm me-1"></span>
          }
          {{ vm().t('cr_btn_save') }}
        </button>
      </div>
    </div>
  </div>
</div>
