@if (loading()) {
  <div class="text-center py-3">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>
} @else {
  <app-gtable
    [columns]="cols()"
    [data]="items()"
    [pagination]="pagination()"
    [loading]="loading()"
    [actions]="actions"
    (pageChange)="pageChange.emit($event)"
    (actionClick)="onAction($event)"
  />
}
