@let vm = facade.vm;
@if (vm().success) {
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    {{ vm().success }}
    <button type="button" class="btn-close" (click)="clearMessages()"></button>
  </div>
}

@if (vm().error) {
  <div class="alert alert-danger alert-dismissible fade show" role="alert">
    {{ vm().error }}
    <button type="button" class="btn-close" (click)="clearMessages()"></button>
  </div>
}

<div class="row align-items-center mb-3">
  <div class="col">
    <h4 class="text-gray-800 fw-bold mb-1">{{ vm().t('per_hdr_title') }}</h4>
    <p class="text-gray-800 mb-0" style="font-size: 0.9rem;">{{ vm().t('per_lbl_subtitle') }}</p>
  </div>
  <div class="col-auto">
    <button class="btn btn-primary" (click)="onNew()">
      <i class="bi bi-plus-lg me-1"></i>{{ vm().t('per_btn_new_period') }}
    </button>
  </div>
</div>

<div class="card shadow mb-4">
  <div class="card-header py-3">
    <h6 class="m-0 fw-bold text-gray-800">{{ vm().t('per_hdr_list') }}</h6>
  </div>
  <div class="card-body">
    <div class="row mb-3">
      <div class="col-md-4">
        <input
          #filterInput
          type="text"
          class="form-control"
          [placeholder]="vm().t('per_plh_search_name')"
          [value]="vm().filterName"
          (input)="onFilter(filterInput.value)"
        />
      </div>
    </div>
    <app-periods-table
      [items]="vm().items"
      [loading]="vm().loading"
      [pagination]="pagination()"
      (pageChange)="onChangePage($event)"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
    />
  </div>
</div>

@if (vm().showFormModal) {
  <app-period-form-modal
    [editing]="vm().editingItem"
    [saving]="vm().saving"
    (save)="onSave($event)"
    (close)="onCloseForm()"
  />
}
