@if (vm().success) {
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    {{ vm().success }}
    <button type="button" class="btn-close" (click)="clearMessages()"></button>
  </div>
}

@if (vm().error) {
  <div class="alert alert-danger alert-dismissible fade show" role="alert">
    {{ vm().error }}
    <button type="button" class="btn-close" (click)="clearMessages()"></button>
  </div>
}

<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h4 class="text-gray-800 fw-bold mb-1">{{ 'per_hdr_title' | message }}</h4>
    <p class="text-gray-800 mb-0" style="font-size: 0.9rem;">{{ 'per_lbl_subtitle' | message }}</p>
  </div>
  <button class="btn btn-primary" (click)="onNew()">
    <i class="bi bi-plus-lg me-1"></i>{{ 'per_btn_new_period' | message }}
  </button>
</div>

<div class="card shadow mb-4">
  <div class="card-header py-3">
    <h6 class="m-0 fw-bold text-gray-800">{{ 'per_hdr_list' | message }}</h6>
  </div>
  <div class="card-body">
    <div class="row mb-3">
      <div class="col-md-4">
        <input
          #filterInput
          type="text"
          class="form-control"
          [placeholder]="'per_plh_search_name' | message"
          [value]="vm().filterName"
          (input)="onFilter(filterInput.value)"
        />
      </div>
    </div>
    <app-periods-table
      [items]="vm().items"
      [loading]="vm().loading"
      [pagination]="pagination()"
      (pageChange)="onChangePage($event)"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
    />
  </div>
</div>

@if (vm().showFormModal) {
  <app-period-form-modal
    [editing]="vm().editingItem"
    [saving]="vm().saving"
    (save)="onSave($event)"
    (close)="onCloseForm()"
  />
}
