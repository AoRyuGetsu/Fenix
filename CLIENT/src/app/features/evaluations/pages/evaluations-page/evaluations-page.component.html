@let vm = facade.vm;

<div class="container-fluid py-3">
  <h4 class="mb-3">{{ vm().t('eval_hdr_title') }}</h4>

  @if (vm().success) {
    <div class="alert alert-success alert-dismissible fade show" role="alert">
      {{ vm().success }}
      <button type="button" class="btn-close" (click)="facade.clearMessages()"></button>
    </div>
  }

  @if (vm().error) {
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      {{ vm().error }}
      <button type="button" class="btn-close" (click)="facade.clearMessages()"></button>
    </div>
  }

  <div class="row mb-3">
    <div class="col-md-4">
      <input
        #filterInput
        type="text"
        class="form-control"
        [placeholder]="vm().t('eval_plh_search_title')"
        [value]="vm().searchTerm"
        (input)="onFilter(filterInput.value)"
      />
    </div>
  </div>

  <app-evaluations-table
    [items]="vm().items"
    [loading]="vm().loading"
    [pagination]="pagination()"
    (pageChange)="onChangePage($event)"
    (fill)="onFill($event)"
  />
</div>
