<div class="card mb-3">
  <div class="card-body">
    <label class="form-label fw-semibold mb-2">
      {{ vm().question.question_order }}. {{ vm().question.text }}
    </label>

    @switch (vm().question.type) {
      @case ('selection') {
        <select
          class="form-select"
          [value]="vm().value"
          (change)="onSelect($event)"
        >
          <option value="" disabled [selected]="!vm().value">{{ vm().t('eval_plh_select_option') }}</option>
          @for (opt of vm().question.options; track trackByOptionId($index, opt)) {
            <option [value]="opt.option_text" [selected]="opt.option_text === vm().value">{{ opt.option_text }}</option>
          }
        </select>
        @if (vm().scaleHint; as hint) {
          <small class="text-muted d-block mt-1">{{ vm().t('eval_lbl_scale_hint', { scale: hint }) }}</small>
        }
      }
      @case ('number') {
        <input
          type="number"
          class="form-control"
          [value]="vm().value"
          (input)="onInput($event)"
        />
      }
      @default {
        <input
          type="number"
          class="form-control"
          [value]="vm().value"
          (input)="onInput($event)"
        />
      }
    }
  </div>
</div>
